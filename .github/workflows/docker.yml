name: Docker validation

on:
  push:
    branches: [main, development, "feature/**"]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: event_management
      POSTGRES_USER: event_app
      POSTGRES_PASSWORD: ci_password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate development Compose configuration
        run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet

      - name: Validate isolated test Compose configuration
        run: docker compose -f compose.yaml -f compose.test.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend production image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runner
          push: false
          tags: tsg-events-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build backend production image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runner
          push: false
          tags: tsg-events-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

name: Docker Build and AWS Deployment Scaffold

on:
  workflow_call:
    inputs:
      image_tag:
        description: Git commit SHA used to tag both images
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      POSTGRES_DB: event_management
      POSTGRES_USER: event_app
      POSTGRES_PASSWORD: ci_password
      BETTER_AUTH_URL: http://localhost:8080
      BETTER_AUTH_SECRET: ci-only-secret-not-used-outside-this-workflow-000000000000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate development Compose configuration
        run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet

      - name: Validate isolated test Compose configuration
        run: docker compose -f compose.yaml -f compose.test.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runner
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            dharishkumar/tsg-frontend:${{ inputs.image_tag }}
            dharishkumar/tsg-frontend:latest
          labels: org.opencontainers.image.revision=${{ inputs.image_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runner
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            dharishkumar/tsg-backend:${{ inputs.image_tag }}
            dharishkumar/tsg-backend:latest
          labels: org.opencontainers.image.revision=${{ inputs.image_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend


  deploy-aws:
    name: Deploy to AWS (future scaffold, disabled by default)
    needs: build-and-publish
    if: ${{ vars.AWS_DEPLOYMENT_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      # This guard intentionally fails closed. Add deployment steps only after the
      # AWS prerequisites and GitHub production-environment approvals are ready.
      - name: Keep production deployment blocked until it is implemented
        run: |
          echo "::error::AWS deployment is only a scaffold; no deployment has been configured."
          exit 1

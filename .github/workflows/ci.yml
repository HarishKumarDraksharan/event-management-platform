name: CI/CD

on:
  push:
    branches: [main, development, "feature/**"]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: "true"
      DATABASE_URL: postgresql://event_app:ci_password@localhost:5432/event_management_test?schema=public
      TEST_DATABASE_URL: postgresql://event_app:ci_password@localhost:5432/event_management_test?schema=public
      BETTER_AUTH_URL: http://localhost:8080
      BETTER_AUTH_SECRET: ci-only-secret-not-used-outside-this-workflow-000000000000
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: event_management_test
          POSTGRES_USER: event_app
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_app -d event_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npm run db:generate

      - name: Apply committed database migrations to the CI PostgreSQL service
        working-directory: backend
        run: npm run db:deploy

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Type-check backend
        working-directory: backend
        run: npm run typecheck

      - name: Require the PostgreSQL integration test configuration
        run: node -e "if (!process.env.TEST_DATABASE_URL) { console.error('TEST_DATABASE_URL is required'); process.exit(1) }"

      - name: Run backend unit and PostgreSQL integration tests
        working-directory: backend
        run: npm test -- --reporter=verbose

      - name: Build backend for production
        working-directory: backend
        run: npm run build

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build

  build-images:
    name: Build and Publish Docker Images
    needs: [backend-tests, frontend-tests]
    permissions:
      contents: read
    uses: ./.github/workflows/docker.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit  

  slack-notification:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, build-images]
    if: ${{ always() }}
    continue-on-error: true
    permissions:
      contents: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Detect workflow cancellation
        id: cancellation
        if: ${{ cancelled() }}
        run: echo "cancelled=true" >> "$GITHUB_OUTPUT"

      - name: Determine pipeline result
        id: result
        if: ${{ always() }}
        env:
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          IMAGES_RESULT: ${{ needs.build-images.result }}
          RUN_CANCELLED: ${{ steps.cancellation.outputs.cancelled == 'true' }}
        run: |
          if [[ "$BACKEND_RESULT" == "failure" || "$FRONTEND_RESULT" == "failure" || "$IMAGES_RESULT" == "failure" ]]; then
            status="failure"
          elif [[ "$RUN_CANCELLED" == "true" || "$BACKEND_RESULT" == "cancelled" || "$FRONTEND_RESULT" == "cancelled" || "$IMAGES_RESULT" == "cancelled" ]]; then
            status="cancelled"
          elif [[ "$BACKEND_RESULT" == "success" && "$FRONTEND_RESULT" == "success" && "$IMAGES_RESULT" == "success" ]]; then
            status="success"
          else
            status="failure"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Warn when Slack is not configured
        if: ${{ always() && env.SLACK_WEBHOOK_URL == '' }}
        run: echo "::warning::Slack notification skipped; configure the repository Actions secret SLACK_WEBHOOK_URL."

      - name: Send consolidated pipeline notification
        id: send
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        continue-on-error: true
        env:
          PROJECT_NAME: TSG EVENTS
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER_EVENT: ${{ github.event_name == 'pull_request' && 'pull request' || github.event_name }}
          PIPELINE_STATUS: ${{ steps.result.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short_sha="${COMMIT_SHA:0:7}"
          payload="$(jq -n \
            --arg project "$PROJECT_NAME" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg branch "$BRANCH_NAME" \
            --arg sha "$short_sha" \
            --arg event "$TRIGGER_EVENT" \
            --arg status "$PIPELINE_STATUS" \
            --arg run_url "$RUN_URL" \
            '{text: ("*" + $project + "* — *" + $status + "*\nWorkflow: " + $workflow + "\nBranch: `" + $branch + "`\nCommit: `" + $sha + "`\nTrigger: " + $event + "\n<" + $run_url + "|View workflow run>")}')"

          if http_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 --request POST --header 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" 2>/dev/null)"; then
            if [[ "$http_status" == 2?? ]]; then
              echo "Slack notification sent."
              exit 0
            fi
            echo "::warning::Slack notification delivery failed (HTTP $http_status); CI status is unchanged."
          else
            echo "::warning::Slack notification delivery failed; CI status is unchanged."
            exit 1
          fi

          exit 1

      - name: Summarize Slack notification outcome
        if: ${{ always() }}
        env:
          WEBHOOK_CONFIGURED: ${{ env.SLACK_WEBHOOK_URL != '' }}
          SEND_OUTCOME: ${{ steps.send.outcome || 'skipped' }}
          NOTIFICATION_JOB_STATUS: ${{ job.status }}
          PIPELINE_STATUS: ${{ steps.result.outputs.status || 'undetermined' }}
        run: |
          if [[ "$WEBHOOK_CONFIGURED" != "true" ]]; then
            echo "Slack notification: skipped (SLACK_WEBHOOK_URL is not configured)." >> "$GITHUB_STEP_SUMMARY"
            echo "Slack notification skipped because SLACK_WEBHOOK_URL is not configured."
          elif [[ "$SEND_OUTCOME" == "success" ]]; then
            echo "Slack notification: delivered. Pipeline status: **$PIPELINE_STATUS**." >> "$GITHUB_STEP_SUMMARY"
            echo "Slack notification delivered for pipeline status: $PIPELINE_STATUS."
          else
            echo "Slack notification: **delivery failed** (step outcome: $SEND_OUTCOME). Pipeline status: **$PIPELINE_STATUS**. Notification job status: $NOTIFICATION_JOB_STATUS." >> "$GITHUB_STEP_SUMMARY"
            echo "Slack notification did not complete successfully (step outcome: $SEND_OUTCOME; job status: $NOTIFICATION_JOB_STATUS). Pipeline status remains $PIPELINE_STATUS."
          fi

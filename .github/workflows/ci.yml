name: CI

on:
  push:
    branches: [main, development, "feature/**"]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://event_app:ci_password@localhost:5432/event_management
      TEST_DATABASE_URL: postgresql://event_app:ci_password@localhost:5432/event_management_test
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: event_management_test
          POSTGRES_USER: event_app
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_app -d event_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Generate Prisma Client
        run: npm run db:generate --prefix backend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Type-check frontend
        run: npm run typecheck --prefix frontend

      - name: Test frontend
        run: npm test --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Lint backend
        run: npm run lint --prefix backend

      - name: Type-check backend
        run: npm run typecheck --prefix backend

      - name: Test backend
        run: npm test --prefix backend

      - name: Build backend
        run: npm run build --prefix backend

name: CI/CD

on:
  push:
    branches: [main, development, "feature/**"]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: "true"
      DATABASE_URL: postgresql://event_app:ci_password@localhost:5432/event_management_test?schema=public
      TEST_DATABASE_URL: postgresql://event_app:ci_password@localhost:5432/event_management_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: event_management_test
          POSTGRES_USER: event_app
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_app -d event_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npm run db:generate

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Type-check backend
        working-directory: backend
        run: npm run typecheck

      - name: Require the PostgreSQL integration test configuration
        run: node -e "if (!process.env.TEST_DATABASE_URL) { console.error('TEST_DATABASE_URL is required'); process.exit(1) }"

      - name: Run backend unit and PostgreSQL integration tests
        working-directory: backend
        run: npm test -- --reporter=verbose

      - name: Build backend for production
        working-directory: backend
        run: npm run build

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build

  build-images:
    name: Build and Publish Docker Images
    needs: [backend-tests, frontend-tests]
    permissions:
      contents: read
    uses: ./.github/workflows/docker.yml
    with:
      image_tag: ${{ github.sha }}

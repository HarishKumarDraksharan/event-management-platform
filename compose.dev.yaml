services:
  frontend:
    build:
      target: development
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  backend:
    build:
      target: development
    command: sh -c "npx prisma generate && npm run dev -- --hostname 0.0.0.0"
    environment:
      NODE_ENV: development
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/event_management_test?schema=public
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_next:/app/.next
      - backend_generated:/app/generated
      - gallery_uploads:/app/uploads

  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  frontend_node_modules:
  frontend_next:
  backend_node_modules:
  backend_next:
  backend_generated:
  gallery_uploads: